name: Sync submissions to HuggingFace dataset

on:
  push:
    branches: [main]
    paths:
      - 'submissions/**'
  workflow_dispatch:

jobs:
  sync-to-hf:
    runs-on: ubuntu-latest
    # Only run if the HF dataset repo is configured
    if: vars.HF_DATASET_REPO != ''
    permissions:
      contents: read
      # OIDC permission for trusted publisher exchange with HuggingFace
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Sync submissions to HF dataset
        env:
          # This is the key: huggingface_hub detects this env var + GitHub Actions
          # and automatically exchanges the GitHub OIDC token for a short-lived HF token.
          # No HF_TOKEN secret needed. Requires trusted publisher configured on HF.
          # For datasets, prefix with "datasets/"
          HF_OIDC_RESOURCE: datasets/${{ vars.HF_DATASET_REPO }}
        run: |
          python - <<'PYEOF'
          import os
          import json
          import glob
          from huggingface_hub import HfApi

          repo_id = os.environ.get("HF_OIDC_RESOURCE", "").replace("datasets/", "")
          if not repo_id:
              print("HF_DATASET_REPO not set, skipping")
              exit(0)

          # huggingface_hub auto-exchanges the OIDC token when HF_OIDC_RESOURCE is set.
          # get_token() will trigger the exchange if needed.
          from huggingface_hub.utils import get_token
          token = get_token()
          if not token:
              print("ERROR: Could not obtain HF token via OIDC exchange.")
              print("Make sure the trusted publisher is configured on HF:")
              print(f"  https://huggingface.co/datasets/{repo_id}/settings")
              print("  Provider: GitHub Actions")
              print("  Repository: charlesdvaught-hash/calibration-kit-public")
              print("  Workflow: sync-to-hf.yml")
              print("  Branch: main")
              exit(1)

          print(f"OIDC token exchange successful. Uploading to {repo_id}")

          api = HfApi()

          # Find all submission JSONs
          files = sorted(glob.glob("submissions/*.json"))
          if not files:
              print("No submissions to sync")
              exit(0)

          print(f"Found {len(files)} submission(s) to sync")

          for fpath in files:
              fname = os.path.basename(fpath)
              path_in_repo = f"data/submissions/{fname}"

              # Validate it's a proper probe result
              try:
                  with open(fpath, "r", encoding="utf-8") as f:
                      data = json.load(f)
                  required = ["model_label", "n_ok", "n_fail"]
                  missing = [k for k in required if k not in data]
                  if missing:
                      print(f"  SKIP {fname}: missing fields {missing}")
                      continue
              except Exception as e:
                  print(f"  SKIP {fname}: invalid JSON ({e})")
                  continue

              print(f"  Uploading {fname} -> {path_in_repo}")
              try:
                  api.upload_file(
                      path_or_fileobj=fpath,
                      path_in_repo=path_in_repo,
                      repo_id=repo_id,
                      repo_type="dataset",
                      commit_message=f"Sync {fname} from GitHub submissions/",
                  )
                  print(f"    OK")
              except Exception as e:
                  print(f"    FAILED: {e}")

          print(f"\nSync complete. View at: https://huggingface.co/datasets/{repo_id}")
          PYEOF
